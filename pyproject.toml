[project]
name = "time-agnostic-library"
version = "7.2.0"
description = "A Python library for performing time-travel queries on RDF datasets compliant with the OCDM v2.0.1 provenance specification."
readme = "README.md"
license = "ISC"
authors = [{name = "Arcangelo Massari", email = "arcangelo.massari@unibo.it"}]
keywords = ["rdf", "provenance", "opencitations", "change-tracking", "time-traversal query"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: ISC License (ISCL)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10, <3.15"
dependencies = [
    "rdflib>=7.5.0",
    "sparqlite>=1.1.0",
]

[dependency-groups]
test = [
    "coverage>=7.13.3",
    "genbadge[coverage]>=1.1.3",
    "pyoxigraph>=0.5.11",
    "pytest>=9.0.2",
    "qlever>=0.5.45",
    "requests>=2.34.2",
]
lint = [
    "pyright>=1.1.410",
    "reuse>=6.2.0",
    "ruff>=0.15.0",
]
benchmark = [
    "matplotlib>=3.10.8",
    "qlever>=0.5.45",
    "requests>=2.32.5",
    "rich>=14.3.2",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "benchmark"},
]

[project.urls]
Homepage = "https://github.com/opencitations/time-agnostic-library"
Repository = "https://github.com/opencitations/time-agnostic-library"
Documentation = "https://opencitations.github.io/time-agnostic-library"

[project.scripts]
test = "tests.run_all_tests:main"

[project.optional-dependencies]
qlever = [
    "pyoxigraph>=0.5.11",
    "qlever>=0.5.45",
]

[tool.pyright]
include = ["src", "tests", "benchmark"]
exclude = ["benchmark/bear/data"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Conflicts with ruff format
    "ISC001",  # Conflicts with ruff format
    "ISC002",  # Multi-line implicit concatenation is how long strings are split
    "ISC004",  # Same, inside collection literals
    "CPY001",  # REUSE headers are checked by `reuse lint`
    "D203",    # Incompatible with D211
    "D213",    # Incompatible with D212
    "D1",      # No mandatory docstrings
    "ANN0",    # No annotations added to existing code (ANN401 stays active)
    "ANN2",    # No annotations added to existing code
    "UP015",   # Unnecessary open mode parameters
    "SIM401",  # Use dict.get()
    "TRY003",  # Would require a custom exception hierarchy
    "C901",    # Complexity refactors of core methods needed
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR0917", # Too many positional arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "SLF001", "PLR2004", "INP001"]
"tests/triplestore_service.py" = ["S603", "S607"]
"benchmark/**" = ["INP001", "T201", "S", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["time_agnostic_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
