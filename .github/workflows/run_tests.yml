name: Run tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CheckCoverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        triplestore: [virtuoso, blazegraph, fuseki, graphdb, qlever]

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --locked --all-extras --dev

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Start test triplestore
      env:
        TRIPLESTORE: ${{ matrix.triplestore }}
      run: |
        chmod +x ./tests/setup-triplestore.sh
        ./tests/setup-triplestore.sh

    - name: Run tests with coverage
      env:
        TRIPLESTORE: ${{ matrix.triplestore }}
      run: |
        uv run coverage run --rcfile=tests/coverage/.coveragerc
        uv run coverage xml
        uv run coverage report

    - name: Stop test triplestore
      if: always()
      env:
        TRIPLESTORE: ${{ matrix.triplestore }}
      run: |
        chmod +x ./tests/teardown-triplestore.sh
        ./tests/teardown-triplestore.sh

    - name: Generate HTML coverage report
      if: matrix.python-version == '3.10' && matrix.triplestore == 'virtuoso'
      run: uv run coverage html -d htmlcov

    - name: Generate coverage badge
      if: matrix.python-version == '3.10' && matrix.triplestore == 'virtuoso'
      run: uv run genbadge coverage -i coverage.xml -o coverage-badge.svg

    - name: Upload coverage report
      if: matrix.python-version == '3.10' && matrix.triplestore == 'virtuoso' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: htmlcov

    - name: Upload coverage badge
      if: matrix.python-version == '3.10' && matrix.triplestore == 'virtuoso' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-badge
        path: coverage-badge.svg
